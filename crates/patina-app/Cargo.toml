[package]
name = "patina-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Patina: the settings and tray app (patina) and the command-line tool (patina-cli)"

[[bin]]
name = "patina-cli"
path = "src/main.rs"

[dependencies]
windows.workspace = true
windows-core.workspace = true
patina-shared = { path = "../patina-shared" }
ort = { version = "=2.0.0-rc.14", features = ["directml", "half"] }
half = "2.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
sha2 = "0.10"
rayon = "1.12.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
tray-icon = "0.26.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[build-dependencies]
embed-resource = "3.0.12"
